services:
  - type: web
    name: cuentas-claras-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_RECEIPT_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: DATABASE_URL
        sync: false
      - key: APP_TOKEN
        sync: false
